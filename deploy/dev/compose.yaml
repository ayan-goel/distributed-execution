services:
  postgres:
    image: postgres:17.11@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make dev-up}
      POSTGRES_DB: dispatch
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, dispatch]
      interval: 1s
      timeout: 3s
      retries: 45
  storage:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: [mini, -dir=/data, -admin.ui=false, -webdav=false, -master.volumeSizeLimitMB=64, -volume.max=2]
    environment:
      AWS_ACCESS_KEY_ID: ${DISPATCH_S3_ACCESS_KEY:?run make dev-up}
      AWS_SECRET_ACCESS_KEY: ${DISPATCH_S3_SECRET_KEY:?run make dev-up}
      S3_BUCKET: dispatch-dev
    ports:
      - "127.0.0.1::8333"
    volumes:
      - storage:/data
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
volumes:
  postgres:
  storage:
